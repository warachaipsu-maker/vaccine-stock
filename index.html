<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกรับ-จ่ายวัคซีน รพ.สต.เกาะแต้ว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #0f766e;
    --brand-dark: #0b5650;
    --brand-soft: #e6f4f2;
    --ink: #123330;
    --muted: #5b6f6c;
    --line: #d7e4e2;
    --surface: #ffffff;
    --bg: #f3f8f7;
    --in: #15803d;
    --in-soft: #e8f7ee;
    --out: #c2410c;
    --out-soft: #fff1e8;
    --ok-bg: #e8f7ee; --ok-ink: #14532d;
    --err-bg: #fdecec; --err-ink: #8a1c1c;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Sarabun", "Tahoma", system-ui, sans-serif;
    font-size: 16px;
    color: var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -200px, #cdeae5 0%, transparent 70%),
      var(--bg);
    min-height: 100vh;
    padding: 0 0 40px;
  }

  /* ===== Header ===== */
  .hero {
    background: linear-gradient(135deg, var(--brand) 0%, #14968b 100%);
    color: #fff;
    padding: 28px 20px 64px;
    text-align: center;
  }
  .hero .badge {
    display: inline-block;
    font-size: 13px;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,.18);
  }
  .hero h1 { font-size: 24px; margin: 12px 0 4px; font-weight: 700; }
  .hero .sub { font-size: 15px; opacity: .9; }

  /* ===== Card ===== */
  .wrap { max-width: 560px; margin: -44px auto 0; padding: 0 16px; position: relative; }
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: 0 10px 30px rgba(15,118,110,.12), 0 1px 3px rgba(0,0,0,.06);
    padding: 22px 20px 24px;
  }
  .section { margin-bottom: 20px; }
  .section-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 700; color: var(--brand-dark);
    margin-bottom: 10px;
  }
  .step {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--brand); color: #fff;
    font-size: 12px; display: inline-flex; align-items: center; justify-content: center;
  }
  label.field { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
  input, select {
    width: 100%;
    padding: 12px 14px;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: #fbfdfd;
    transition: border-color .15s, box-shadow .15s, background .15s;
    appearance: none;
  }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%230f766e' d='M6 8L0 0h12z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 4px rgba(15,118,110,.15);
    background: #fff;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 420px) { .row { grid-template-columns: 1fr; } }

  .hint {
    margin-top: 8px;
    font-size: 13px;
    color: var(--brand-dark);
    background: var(--brand-soft);
    border-radius: 8px;
    padding: 8px 10px;
    display: none;
  }
  .hint.show { display: block; }

  /* ===== Segmented toggle ===== */
  .seg {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    background: #eef3f2; padding: 5px; border-radius: 12px;
  }
  .seg label {
    position: relative;
    text-align: center;
    padding: 11px 8px;
    border-radius: 9px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: all .18s;
    user-select: none;
  }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked[value="รับ"]) { background: var(--in-soft); color: var(--in); box-shadow: inset 0 0 0 1.5px var(--in); }
  .seg label:has(input:checked[value="จ่าย"]) { background: var(--out-soft); color: var(--out); box-shadow: inset 0 0 0 1.5px var(--out); }
  .seg label:has(input:focus-visible) { outline: 3px solid rgba(15,118,110,.35); outline-offset: 2px; }

  /* ===== Quantity stepper ===== */
  .qty { display: flex; align-items: center; gap: 10px; }
  .qty button.step-btn {
    width: 48px; height: 48px; flex: 0 0 48px; margin: 0;
    border-radius: 12px; border: 1.5px solid var(--line);
    background: #fff; color: var(--brand-dark); font-size: 24px; font-weight: 700;
    cursor: pointer; padding: 0; font-family: inherit;
  }
  .qty button.step-btn:active { background: var(--brand-soft); }
  .qty input { text-align: center; font-size: 20px; font-weight: 700; }

  /* ===== Remember checkbox ===== */
  .remember {
    display: flex; align-items: center; gap: 8px;
    margin-top: 12px; font-size: 14px; color: var(--muted); cursor: pointer;
  }
  .remember input { width: 18px; height: 18px; margin: 0; accent-color: var(--brand); }

  /* ===== Button ===== */
  .submit {
    width: 100%;
    margin-top: 8px;
    padding: 15px;
    font: inherit; font-size: 18px; font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--brand), #14968b);
    border: none; border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(15,118,110,.25);
    transition: transform .08s, box-shadow .2s, opacity .2s;
  }
  .submit:hover { box-shadow: 0 10px 22px rgba(15,118,110,.32); }
  .submit:active { transform: translateY(1px); }
  .submit:disabled { opacity: .6; cursor: default; box-shadow: none; }

  /* ===== Result ===== */
  #result {
    display: none;
    margin-top: 18px;
    border-radius: 12px;
    padding: 16px;
    font-size: 15px;
    line-height: 1.6;
    animation: rise .25s ease-out;
  }
  #result.show { display: block; }
  #result.ok { background: var(--ok-bg); color: var(--ok-ink); }
  #result.err { background: var(--err-bg); color: var(--err-ink); }
  #result .title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  #result .big { font-size: 28px; font-weight: 700; margin: 6px 0 0; }
  #result .small { font-size: 14px; opacity: .85; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 20px; }
</style>
</head>
<body>

<header class="hero">
  <span class="badge">ระบบคลังวัคซีน</span>
  <h1>บันทึกรับ-จ่ายวัคซีน</h1>
  <div class="sub">รพ.สต.เกาะแต้ว</div>
</header>

<main class="wrap">
  <section class="card">
    <form id="f" autocomplete="off">

      <div class="section">
        <div class="section-title"><span class="step">1</span>เลือกวัคซีน</div>
        <select id="vaccine" required>
          <option value="">กำลังโหลดรายการ...</option>
        </select>
        <div class="hint" id="vaccineHint"></div>
      </div>

      <div class="section">
        <div class="section-title"><span class="step">2</span>ประเภทและจำนวน</div>
        <div class="seg">
          <label><input type="radio" name="type" value="รับ" checked>+ รับเข้า</label>
          <label><input type="radio" name="type" value="จ่าย">− จ่ายออก</label>
        </div>

        <label class="field">จำนวน (ขวด)</label>
        <div class="qty">
          <button type="button" class="step-btn" id="minus" aria-label="ลดจำนวน">−</button>
          <input type="number" id="qty" min="1" step="1" inputmode="numeric" placeholder="0" required>
          <button type="button" class="step-btn" id="plus" aria-label="เพิ่มจำนวน">+</button>
        </div>

        <div class="row">
          <div>
            <label class="field" for="date">วันที่</label>
            <input type="date" id="date" required>
          </div>
          <div>
            <label class="field" for="party" id="partyLabel">รับจาก</label>
            <input type="text" id="party" placeholder="เช่น สสอ., รพ.">
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title"><span class="step">3</span>ล็อตและอายุวัคซีน</div>
        <div class="row">
          <div>
            <label class="field" for="lot">เลขที่ผลิต (Lot)</label>
            <input type="text" id="lot">
          </div>
          <div>
            <label class="field" for="expiry">วันหมดอายุ</label>
            <input type="date" id="expiry">
          </div>
        </div>
        <div class="row">
          <div>
            <label class="field" for="useBefore">ใช้ก่อนวันที่ (ถ้ามี)</label>
            <input type="date" id="useBefore">
          </div>
          <div>
            <label class="field" for="note">หมายเหตุ</label>
            <input type="text" id="note">
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title"><span class="step">4</span>ยืนยันผู้บันทึก</div>
        <div class="row">
          <div>
            <label class="field" for="recorder">ชื่อผู้บันทึก</label>
            <input type="text" id="recorder" placeholder="เช่น วราชัย" required>
          </div>
          <div>
            <label class="field" for="pin">รหัสบันทึก</label>
            <input type="password" id="pin" inputmode="numeric" required>
          </div>
        </div>
        <label class="remember">
          <input type="checkbox" id="remember" checked>
          จำชื่อและรหัสไว้ในเครื่องนี้
        </label>
      </div>

      <button type="submit" class="submit" id="btn">บันทึกรายการ</button>
    </form>

    <div id="result" role="status"></div>
  </section>

  <footer>ข้อมูลบันทึกลง Google Sheet ของหน่วยงาน</footer>
</main>

<script>
  // URL ของ Web App (Apps Script)
  const API_URL = 'https://script.google.com/macros/s/AKfycbwM5K6lPi0z3AXVRiYWLA1TCr5p5KIgyUGxbh9wwl-Zx7YqPJ0FyrkA4ObruddFubsN/exec';
  const STORE_KEY = 'vaccine_recorder_v1';

  let vaccines = [];
  const $ = id => document.getElementById(id);

  function showResult(kind, title, lines) {
    const box = $('result');
    box.className = 'show ' + kind;
    box.innerHTML = '';
    const t = document.createElement('div');
    t.className = 'title';
    t.textContent = title;
    box.appendChild(t);
    lines.forEach(l => {
      const p = document.createElement('div');
      p.className = l.big ? 'big' : (l.small ? 'small' : '');
      p.textContent = l.text;
      box.appendChild(p);
    });
  }

  function todayLocal() {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }

  function selectedType() {
    return document.querySelector('input[name="type"]:checked').value;
  }

  function updateLabels() {
    const isReceive = selectedType() === 'รับ';
    $('partyLabel').textContent = isReceive ? 'รับจาก' : 'จ่ายให้';
    $('party').placeholder = isReceive ? 'เช่น สสอ., รพ.' : 'เช่น โรงเรียน, อสม.';
    $('lot').required = isReceive;
    $('expiry').required = isReceive;
  }

  function updateVaccineHint() {
    const v = vaccines.find(x => x.code === $('vaccine').value);
    const hint = $('vaccineHint');
    if (v) {
      hint.textContent = '1 ขวด = ' + v.dosesPerBottle + ' โดส  •  1 กล่อง = ' + v.bottlesPerBox + ' ขวด';
      hint.classList.add('show');
    } else {
      hint.classList.remove('show');
    }
  }

  function setQty(n) {
    $('qty').value = Math.max(1, n);
  }

  // จำชื่อและรหัสไว้ในเบราว์เซอร์ของเครื่องนี้ (เฉพาะเครื่องที่ติ๊กเลือก)
  function loadRemembered() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (saved) {
        $('recorder').value = saved.recorder || '';
        $('pin').value = saved.pin || '';
      }
    } catch (_) {}
  }

  function saveRemembered(recorder, pin) {
    try {
      if ($('remember').checked) {
        localStorage.setItem(STORE_KEY, JSON.stringify({ recorder, pin }));
      } else {
        localStorage.removeItem(STORE_KEY);
      }
    } catch (_) {}
  }

  async function loadVaccines() {
    try {
      const res = await fetch(API_URL + '?action=vaccines');
      const json = await res.json();
      if (!json.ok) throw new Error(json.message);

      vaccines = json.data.filter(v => v.active);
      const sel = $('vaccine');
      sel.innerHTML = '<option value="">-- เลือกวัคซีน --</option>';
      vaccines.forEach(v => {
        const o = document.createElement('option');
        o.value = v.code;
        o.textContent = v.name + ' (' + v.fullName + ')';
        sel.appendChild(o);
      });
    } catch (err) {
      $('vaccine').innerHTML = '<option value="">โหลดไม่สำเร็จ</option>';
      showResult('err', 'โหลดรายการวัคซีนไม่สำเร็จ', [{ text: err.message }]);
    }
  }

  async function save(e) {
    e.preventDefault();

    const type = selectedType();
    const recorder = $('recorder').value.trim();
    const pin = $('pin').value.trim();
    const data = {
      date: $('date').value,
      vaccineCode: $('vaccine').value,
      type: type,
      party: $('party').value.trim(),
      qtyBottles: Number($('qty').value),
      lot: $('lot').value.trim(),
      expiry: $('expiry').value,
      useBefore: $('useBefore').value,
      note: $('note').value.trim(),
      recorder: recorder
    };

    // ตรวจฝั่งหน้าเว็บก่อนส่ง (ฝั่งเซิร์ฟเวอร์ตรวจซ้ำเสมอ)
    if (!data.vaccineCode) return showResult('err', 'ยังไม่ได้เลือกวัคซีน', [{ text: 'กรุณาเลือกวัคซีนในขั้นที่ 1' }]);
    if (!Number.isInteger(data.qtyBottles) || data.qtyBottles <= 0) return showResult('err', 'จำนวนไม่ถูกต้อง', [{ text: 'จำนวนต้องเป็นจำนวนเต็มมากกว่า 0' }]);
    if (!data.date) return showResult('err', 'ยังไม่ได้เลือกวันที่', [{ text: 'กรุณาเลือกวันที่' }]);
    if (type === 'รับ' && (!data.lot || !data.expiry)) return showResult('err', 'ข้อมูลไม่ครบ', [{ text: 'การรับเข้าต้องกรอก Lot และวันหมดอายุ' }]);
    if (!recorder) return showResult('err', 'ยังไม่ได้ระบุชื่อผู้บันทึก', [{ text: 'กรุณากรอกชื่อผู้บันทึกในขั้นที่ 4' }]);
    if (!pin) return showResult('err', 'ยังไม่ได้ใส่รหัส', [{ text: 'กรุณาใส่รหัสบันทึกในขั้นที่ 4' }]);

    const btn = $('btn');
    btn.disabled = true;
    btn.textContent = 'กำลังบันทึก...';
    $('result').className = '';

    try {
      // ใช้ text/plain เพื่อหลีกเลี่ยง CORS preflight ของ Apps Script
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'record', pin: pin, data: data })
      });
      const text = await res.text();

      let json;
      try {
        json = JSON.parse(text);
      } catch (_) {
        throw new Error('ระบบไม่ได้ตอบกลับ ตรวจสอบว่า Web App ถูก Deploy เป็น "ทุกคน (Anyone)" แล้ว');
      }
      if (!json.ok) throw new Error(json.message);

      saveRemembered(recorder, pin);

      const v = vaccines.find(x => x.code === data.vaccineCode);
      const lines = [
        { text: 'รหัสรายการ ' + json.id, small: true },
        { text: 'ยอดคงเหลือ', small: true },
        { text: json.balanceAfter + ' ขวด', big: true }
      ];
      if (v) lines.push({ text: '= ' + (json.balanceAfter * v.dosesPerBottle) + ' โดส', small: true });
      showResult('ok', '✓ บันทึก' + (type === 'รับ' ? 'รับเข้า' : 'จ่ายออก') + 'สำเร็จ', lines);

      $('qty').value = '';
      $('lot').value = '';
      $('expiry').value = '';
      $('useBefore').value = '';
      $('note').value = '';
    } catch (err) {
      showResult('err', 'บันทึกไม่สำเร็จ', [{ text: err.message }]);
    } finally {
      btn.disabled = false;
      btn.textContent = 'บันทึกรายการ';
    }
  }

  document.querySelectorAll('input[name="type"]').forEach(r => r.addEventListener('change', updateLabels));
  $('vaccine').addEventListener('change', updateVaccineHint);
  $('minus').addEventListener('click', () => setQty((Number($('qty').value) || 1) - 1));
  $('plus').addEventListener('click', () => setQty((Number($('qty').value) || 0) + 1));
  $('f').addEventListener('submit', save);

  $('date').value = todayLocal();
  loadRemembered();
  updateLabels();
  loadVaccines();
</script>
</body>
</html>
